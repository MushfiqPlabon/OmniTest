[project]
name = "omnitest"
version = "0.1.0"
description = "OmniTest — GED/SAT AI Prep Backend (FastAPI, PostgreSQL + pgvector, Gemini, FastMCP)"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Mushfiqur Rahman Plaban" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "fastapi-filter>=0.1.0",
    "fastapi-pagination>=0.12.0",
    "fastmcp>=0.4.0",
    "google-genai>=0.1.0",
    "langchain-text-splitters>=1.1.3",
    "pgvector>=0.3.5",
    "pwdlib[argon2]>=0.2.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]


