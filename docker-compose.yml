services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnitest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnitest
      POSTGRES_USER: omnitest
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnitest -d omnitest"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: omnitest_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://omnitest:devpassword@postgres:5432/omnitest
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-super-secret-random-key-at-least-32-chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dev-key}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_VERSION: ${GEMINI_API_VERSION:-v1}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENABLE_DEMO_ACCOUNTS: ${ENABLE_DEMO_ACCOUNTS:-true}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             python -m scripts.ingest &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
